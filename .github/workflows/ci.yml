name: Stabilize checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI and verify release checksum
        shell: bash
        run: |
          mkdir -p scratch/security
          cd scratch/security
          curl --fail --location --retry 2 -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --location --retry 2 -O https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          awk '$2 == "gitleaks_8.24.3_linux_x64.tar.gz"' gitleaks_8.24.3_checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
      - name: Scan git history without licence or API credentials
        run: ./scratch/security/gitleaks git --redact --exit-code 1 .
